# Builds the Windows installer on GitHub's Windows machines.
# Push a tag like v0.7.0 and the installer shows up on the repo's Releases
# page. Building on real Windows avoids cross-compiling the native pieces
# (koffi's Windows binary, the NSIS uninstaller) from another OS.
name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The installer is named from package.json, so a tag pushed on top of
      # stale files publishes an old installer under the new release (v0.13.0
      # shipped Keystone.Setup.0.8.0.exe this way). Stop before building.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but package.json at the repo root says $v."
            if [ -f keystone/package.json ]; then
              echo "::error::Found a nested keystone/ folder: the release zip was unpacked one level too deep. Move what's inside keystone/ to the repo root, delete the empty keystone/ folder, commit, and push the tag again."
            fi
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Code signing with Azure Artifact Signing (see docs/SIGNING.md). It
      # switches on by itself once the repo has the three AZURE_* secrets and
      # the four AZURE_SIGNING_* variables; until then builds are unsigned,
      # exactly as before. Half a setup is an error rather than a silent
      # unsigned release.
      - name: Check code-signing setup
        id: signing
        shell: bash
        env:
          HAS_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          set_count=0
          for v in "$ENDPOINT" "$ACCOUNT" "$PROFILE" "$PUBLISHER"; do [ -n "$v" ] && set_count=$((set_count+1)); done
          if [ "$HAS_SECRET" != "true" ] && [ "$set_count" = 0 ]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No code-signing setup: building an unsigned installer."
            exit 0
          fi
          if [ "$HAS_SECRET" != "true" ] || [ "$set_count" != 4 ]; then
            echo "::error::Code signing is half set up. Needed: secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, AZURE_SIGNING_PUBLISHER. See docs/SIGNING.md."
            exit 1
          fi
          case "$ENDPOINT" in
            https://*.codesigning.azure.net|https://*.codesigning.azure.net/) ;;
            *) echo "::error::AZURE_SIGNING_ENDPOINT should look like https://eus.codesigning.azure.net (the region of your signing account)."; exit 1 ;;
          esac
          echo "sign=true" >> "$GITHUB_OUTPUT"

      - name: Build installer (unsigned)
        if: steps.signing.outputs.sign != 'true'
        run: npm run dist
        env:
          # Windows SmartScreen shows "Unknown publisher" for unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build and sign installer
        if: steps.signing.outputs.sign == 'true'
        shell: bash
        # Settings go on the command line rather than in package.json so the
        # repo works for anyone, signed or not.
        run: >
          npm run dist --
          "-c.win.azureSignOptions.publisherName=$PUBLISHER"
          "-c.win.azureSignOptions.endpoint=$ENDPOINT"
          "-c.win.azureSignOptions.codeSigningAccountName=$ACCOUNT"
          "-c.win.azureSignOptions.certificateProfileName=$PROFILE"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Read by Azure's sign-in library (EnvironmentCredential).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}

      # Don't publish something that only looks signed.
      - name: Check the signature
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem dist/*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status), signed by $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Error "$($f.Name) isn't validly signed: $($sig.StatusMessage)"; exit 1 }
          }

      # Only on a manual run, and only for three days. A tagged build already
      # puts the installer on the Releases page, so a second copy here was
      # the same file stored twice, for GitHub's default 90 days, on every
      # release. Artifacts count against the account's Actions storage.
      - name: Keep the installer as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: keystone-installer
          path: dist/*.exe
          retention-days: 3

      - name: Attach to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
