# Clears the workflow runs' stored files.
#
# A GitHub account's Actions storage is 0.5 GB on the free plan, shared by
# every file a workflow run keeps (installers, downloads) and by private
# packages. When it is full, no run can keep anything, and the runs fail.
# This deletes every stored file older than the age given (two days unless
# you pick another), every Sunday and on demand from the Actions tab.
#
# Release files on the Releases page are not touched and do not count.
name: Clear stored files

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: Delete stored files older than this many days (0 deletes them all)
        default: "2"

permissions:
  actions: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete old stored files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '2' }}
        run: |
          cutoff=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting stored files created before ${cutoff}"
          # Every page, oldest included: the list is newest first.
          gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"${cutoff}\") | \"\(.id) \(.size_in_bytes) \(.name)\"" > old.txt
          count=0; bytes=0
          while read -r id size name; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" && count=$((count+1)) && bytes=$((bytes+size))
          done < old.txt
          echo "Deleted ${count} stored files, $((bytes / 1048576)) MB. GitHub updates the storage figure within a few hours."
