# Builds the Windows installer on GitHub's Windows machines.
# Push a tag like v0.7.0 and the installer shows up on the repo's Releases
# page. Building on real Windows avoids cross-compiling the native pieces
# (koffi's Windows binary, the NSIS uninstaller) from another OS.
name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The installer is named from package.json, so a tag pushed on top of
      # stale files publishes an old installer under the new release (v0.13.0
      # shipped Keystone.Setup.0.8.0.exe this way). Stop before building.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but package.json at the repo root says $v."
            if [ -f keystone/package.json ]; then
              echo "::error::Found a nested keystone/ folder: the release zip was unpacked one level too deep. Move what's inside keystone/ to the repo root, delete the empty keystone/ folder, commit, and push the tag again."
            fi
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer
        run: npm run dist
        env:
          # No code-signing certificate; Windows SmartScreen will warn once.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystone-installer
          path: dist/*.exe

      - name: Attach to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
